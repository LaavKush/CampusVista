        // =========================================================================
        // B. PANNELLUM AND LEAFLET INITIALIZATION (No functional changes)
        // =========================================================================
        
        let viewer;
        let map;
        let mapMarkers = {};
        let activeLocationKey = "entrance_gate"; 

        function initializePannellum() {
            const scenes = {};
            for (const key in campusLocations) {
                const location = campusLocations[key];
                
                const pannellumHotspots = location.hotspots.map(h => ({
                    ...h,
                    sceneId: h.sceneId,
                    createTooltipFunc: createHotspotTooltip,
                    clickHandlerFunc: clickHotspot
                }));

                scenes[key] = {
                    "title": location.title,
                    "type": "equirectangular",
                    "pano": location.image,
                    "hotSpots": pannellumHotspots
                };
            }

            viewer = pannellum.viewer('panorama', {
                "default": {
                    "firstScene": activeLocationKey,
                    "sceneFadeDuration": 1000,
                    "autoLoad": true,
                    "haov": 360,
                    "vaov": 180,
                    "vOffset": 0,
                    "showZoom": false,
                    "keyboardZoom": false,
                    "mouseZoom": false 
                },
                "scenes": scenes
            });
            
            viewer.on('load', function() {
                activeLocationKey = viewer.getScene();
                updateMapMarker();
            });
        }

        function initializeLeafletMap() {
            const initialCoords = [campusLocations[activeLocationKey].lat, campusLocations[activeLocationKey].lng];
            
            map = L.map('map', { 
                center: initialCoords, 
                zoom: 18,
                zoomControl: false,
                attributionControl: false
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
            }).addTo(map);

            for (const key in campusLocations) {
                const location = campusLocations[key];
                const marker = L.circleMarker([location.lat, location.lng], {
                    radius: 6,
                    color: '#004a99',
                    fillColor: '#004a99',
                    fillOpacity: 1
                })
                .addTo(map)
                .bindTooltip(location.title, { permanent: false, direction: 'right' })
                .on('click', () => {
                    changeScene(key);
                });
                mapMarkers[key] = marker;
            }
            
            updateMapMarker();
        }
        
        // =========================================================================
        // C. MAP & VIEWER FUNCTIONS (No functional changes)
        // =========================================================================

        function createHotspotTooltip(hotSpotDiv, args) {
            hotSpotDiv.classList.add('custom-hotspot');
            const span = document.createElement('span');
            span.innerHTML = args.text;
            hotSpotDiv.appendChild(span);
        }

        function clickHotspot(e) {
            activeLocationKey = e.sceneId;
            updateMapMarker();
        }

        function changeScene(newSceneId) {
            if (newSceneId !== activeLocationKey) {
                viewer.loadScene(newSceneId);
                activeLocationKey = newSceneId;
                updateMapMarker();
            }
        }

        function updateMapMarker() {
            for (const key in mapMarkers) {
                mapMarkers[key].setStyle({ fillColor: '#004a99', color: '#004a99', radius: 6 });
            }

            const activeMarker = mapMarkers[activeLocationKey];
            if (activeMarker) {
                activeMarker.setStyle({ fillColor: '#cc0000', color: '#cc0000', radius: 8 });
                
                const latlng = activeMarker.getLatLng();
                map.panTo(latlng);
            }
        }

        function toggleMap() {
            const mapContainer = document.getElementById('map-container');
            if (mapContainer.classList.contains('hidden')) {
                mapContainer.classList.remove('hidden');
                setTimeout(() => { map.invalidateSize(); }, 300); 
            } else {
                mapContainer.classList.add('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializePannellum();
            initializeLeafletMap();
        });
